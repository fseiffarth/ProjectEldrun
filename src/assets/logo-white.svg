<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="128" height="128" fill="none" role="img" aria-label="Eldrun">
  <title>Eldrun</title>
  <!--
    Eldrun logo (white variant for dark backgrounds) — a circuit "tree of life"
    inside a ring, crowned by a gold spark. Same geometry as logo.svg; the
    dark-green traces are recolored to white so the mark reads on dark chrome.
    A black circle backdrop keeps it visible on light surfaces (e.g. GitHub's
    white README background).
  -->
  <circle cx="256" cy="256" r="256" fill="#000000" />
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Ring + both outer legs as one stroke: each leg bends through an
         r=20 fillet that meets the ring tangentially, so no seam or gap.
         The ring stays open at the bottom, where the trunk passes through. -->
    <path d="M 165 190 L 165 238 L 233 306 L 233 470.74 A 20 20 0 0 1 209.07 490.35 A 239 239 0 1 1 302.93 490.35 A 20 20 0 0 1 279 470.74 L 279 306 L 347 238 L 347 190" stroke-width="13" />

    <!-- Central trunk stem, running out through the ring's opening. -->
    <path d="M 256 161 L 256 499" stroke-width="13" />

    <!-- Left-side branches (authored), then mirrored. -->
    <g id="eldrun-branches">
      <!-- L2 → vertical → diagonal → L3 (trace stops at the pad on both sides) → 45° diagonal down into the leg. -->
      <path d="M 98 249 L 98 289 L 124.2 315.2 M 166.01 352.31 L 233 405" stroke-width="13" />
    </g>
    <use href="#eldrun-branches" transform="translate(512,0) scale(-1,1)" />

    <!-- Node terminals (thinner stroke than the traces), each filled with its
         own colour, stepping around the arc from bottom-left to bottom-right. -->
    <circle cx="144" cy="335" r="26" fill="#EB8182" stroke-width="10" />
    <circle cx="98" cy="221" r="26" fill="#ED946C" stroke-width="10" />
    <circle cx="165" cy="162" r="26" fill="#E7B369" stroke-width="10" />
    <circle cx="347" cy="162" r="26" fill="#72D0D0" stroke-width="10" />
    <circle cx="414" cy="221" r="26" fill="#5ABBE6" stroke-width="10" />
    <circle cx="368" cy="335" r="26" fill="#80A3F0" stroke-width="10" />
  </g>

  <!-- Gold four-point spark above the trunk. -->
  <path d="M 256 61
           C 261 92 268 96 292 101
           C 268 106 261 110 256 142
           C 251 110 244 106 220 101
           C 244 96 251 92 256 61 Z"
        fill="#C79A45" />
</svg>
